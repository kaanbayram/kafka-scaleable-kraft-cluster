services:
  broker1:
    image: apache/kafka:3.7.0
    container_name: broker1
    hostname: broker1
    ports:
      - "9092:9092"
    volumes:
      - ./data/broker1:/var/lib/kafka/data
      - ./configs/broker1.properties:/opt/kafka/config/kraft/server.properties
      - ./kafka-libs/cruise-control-metrics-reporter-2.5.144-SNAPSHOT.jar:/opt/kafka/libs/cruise-control-metrics-reporter-2.5.144-SNAPSHOT.jar
    command: >
      bash -c "if [ ! -f /var/lib/kafka/data/meta.properties ]; then /opt/kafka/bin/kafka-storage.sh format --ignore-formatted --cluster-id 6VKsvE_XSzC1zMWfZod8sg --config /opt/kafka/config/kraft/server.properties; fi && /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties"

  broker2:
    image: apache/kafka:3.7.0
    container_name: broker2
    hostname: broker2
