  kafka-console:
    image: redpandadata/console:v2.2.4
    container_name: kafka-console
    ports:
      - "3030:8080"
    volumes:
      - ./console-config.yaml:/etc/console-config.yaml
    command: ["--config.filepath=/etc/console-config.yaml"]

  cruise-control:
    image: my-cruise-control
    container_name: cruise-control
    hostname: cruise-control
    ports:
      - "9090:9090"   # Cruise Control UI / API erişimi
    volumes:
      - ./configs/cruisecontrol.properties:/opt/cruise-control/config/cruisecontrol.properties
    environment:
      - KAFKA_BROKERS=broker1:9092,broker2:9092,broker3:9092,broker4:9092,broker5:9092,broker6:9092
    depends_on:
      - broker1
      - broker2
      - broker3
      - broker4




