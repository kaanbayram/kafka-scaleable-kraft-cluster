      - ./configs/broker6.properties:/opt/kafka/config/kraft/server.properties
      - ./kafka-libs/cruise-control-metrics-reporter-2.5.144-SNAPSHOT.jar:/opt/kafka/libs/cruise-control-metrics-reporter-2.5.144-SNAPSHOT.jar
    command: >
